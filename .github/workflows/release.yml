# Builds the Windows installer (Setup.exe) and publishes it as a GitHub Release.
# Runs on every push to main: if package.json has a version that has no release yet,
# it builds MikesPDFStudio-Setup-<version>.exe and publishes release v<version>
# (installed apps then update themselves). Otherwise it only builds, for checking.
name: Build Windows installer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Is this a new version?
        id: ver
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v=$(node -p "require('./package.json').version")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if gh release view "v$v" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v$v already exists - build only."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "New version v$v - will publish."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Build editor (desktop/index.html)
        run: npm run build:html

      - name: Build installer and publish release
        if: steps.ver.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --x64 --publish always

      - name: Build installer only
        if: steps.ver.outputs.publish != 'true'
        run: npx electron-builder --win --x64 --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ steps.ver.outputs.version }}
          path: |
            release/*.exe
            release/latest.yml
